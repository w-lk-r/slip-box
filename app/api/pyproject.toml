[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slip-box-api"
version = "0.1.0"
description = "Slip Box FastAPI backend — Lambda-deployed, fronts the AgentCore Runtime agent and DynamoDB"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3 >= 1.35.0",
    "botocore[crt] >= 1.35.0",
    "fastapi >= 0.115.0",
    "mangum >= 0.19.0",
    "pydantic >= 2.9.0",
    "python-dotenv >= 1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
